<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="app" data-mode="work">
        <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
        <div id="center">
            <section class="pomodoro-timer" aria-label="Pomodoro timer">
                <h1 class="pomodoro-timer__title">Pomodoro Timer</h1>
                <p class="mode-indicator" id="mode-label">Work</p>
                <div class="time-display" id="time-display" role="timer" aria-live="polite" aria-atomic="true">25:00</div>
                <div class="pomodoro-counter" id="pomodoro-counter" aria-live="polite" aria-atomic="true" aria-label="No pomodoros completed yet">
                    <div class="pomodoro-counter__icons" id="pomodoro-counter-icons" aria-hidden="true"></div>
                </div>
                <div class="timer-controls">
                    <button type="button" class="control-button" id="start-pause-button" aria-pressed="false">Start</button>
                    <button type="button" class="control-button" id="reset-button">Reset</button>
                </div>
            </section>
            <section class="pomodoro-settings" aria-labelledby="settings-heading">
                <h2 id="settings-heading" class="pomodoro-settings__title">Customize your timer</h2>
                <div class="settings-groups">
                    <div class="settings-group">
                        <label for="work-minutes-input" class="settings-group__label">Work</label>
                        <input id="work-minutes-input" type="number" min="0" max="180" step="1" value="25" />
                    </div>
                    <div class="settings-group">
                        <label for="break-minutes-input" class="settings-group__label">Break</label>
                        <input id="break-minutes-input" type="number" min="0" max="180" step="1" value="5" />
                    </div>
                </div>
                <button type="button" class="control-button" id="apply-settings-button">Apply Timer</button>
            </section>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
